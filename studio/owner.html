<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Owner door — Prompt Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#08080a;color:#f5f0e8;font-family:IBM Plex Sans,system-ui,sans-serif;padding:1.5rem;}
    .card{max-width:24rem;width:100%;border:1px solid #3a2a18;border-radius:10px;padding:1.5rem;background:#100e14;}
    h1{font-family:Bebas Neue,sans-serif;letter-spacing:.08em;font-size:1.8rem;margin:0 0 .75rem;background:linear-gradient(180deg,#ffe566,#ff9a1f);-webkit-background-clip:text;color:transparent;}
    p{color:#c9c0b4;line-height:1.5;}
    input{width:100%;box-sizing:border-box;padding:.85rem;margin:.5rem 0 1rem;border-radius:6px;border:1px solid #4a3a28;background:#16141c;color:#fff;font-size:1rem;}
    button{width:100%;padding:.95rem;border:0;border-radius:6px;font-weight:700;cursor:pointer;background:linear-gradient(180deg,#ffe566,#ff9a1f);color:#1a1000;}
    .err{color:#ff6b6b;min-height:1.2rem;font-size:.85rem;}
    a{color:#ffb24a;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Owner door</h1>
    <p>Paste your owner key once. This device remembers it. Bookmark this page for a quick way in.</p>
    <label for="k">Owner key</label>
    <input id="k" autocomplete="off" spellcheck="false" placeholder="FLAMES-OWNER-…">
    <div class="err" id="e"></div>
    <button type="button" id="go">Open my machine</button>
    <p style="margin-top:1rem;font-size:.85rem;"><a href="/studio.html">Studio</a></p>
  </div>
  <script src="/studio/app/assets/access-gate.js?v=20260905a"></script>
  <script>
    (function () {
      var input = document.getElementById('k');
      var err = document.getElementById('e');
      async function go() {
        err.textContent = '';
        // reuse gate unlock by navigating with key
        var key = (input.value || '').trim();
        if (!key) { err.textContent = 'Enter your owner key.'; return; }
        location.href = '/studio/app/?key=' + encodeURIComponent(key);
      }
      document.getElementById('go').onclick = go;
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
      // If already unlocked as owner on this device, go straight in
      try {
        var s = JSON.parse(localStorage.getItem('pm_access_v1') || 'null');
        if (s && s.role === 'owner') location.replace('/studio/app/');
      } catch (e) {}
    })();
  </script>
</body>
</html>
