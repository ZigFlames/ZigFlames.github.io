<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/studio/app/">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zig Flames Prompt Machine</title>
    <meta name="description" content="Zig Flames Prompt Machine — build cinematic prompts on ZigFlames.com." />
    <link rel="icon" type="image/svg+xml" href="./placeholder.svg" />
    <meta property="og:title" content="Zig Flames Prompt Machine" />
    <meta property="og:description" content="Zig Flames Prompt Machine — build cinematic prompts on ZigFlames.com." />
    <meta property="og:type" content="website" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Oswald:wght@600&amp;family=IBM+Plex+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
    <style>html,body{margin:0;min-height:100%;background:#08080a;color:#f5f0e8;}</style>
    <script src="./assets/pm-storage.js?v=20260905m"></script>
    <script src="./assets/access-gate.js?v=20260905m"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:2rem;font-family:sans-serif;">Enable JavaScript to open Prompt Machine.</p></noscript>
    <script>
      (async function () {
        function ready() {
          return new Promise(function (resolve) {
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', resolve, { once: true });
            } else {
              resolve();
            }
          });
        }
        function fail(msg) {
          document.body.innerHTML = '<p style="color:#f5f0e8;font-family:IBM Plex Sans,sans-serif;padding:2rem;max-width:28rem;line-height:1.5;">'
            + (msg || 'Access check failed.')
            + ' <a href="/studio/owner.html" style="color:#ffb24a;">Owner door</a> · '
            + '<a href="/studio.html" style="color:#ffb24a;">Studio</a></p>';
        }
        try {
          await ready();
          if (!window.__pmGate || !window.__pmGate.ensureAccess) {
            fail('Access gate failed to load.');
            return;
          }
          var ok = await window.__pmGate.ensureAccess();
          if (!ok) return;
          if (!document.getElementById('root')) {
            var root = document.createElement('div');
            root.id = 'root';
            document.body.appendChild(root);
          }
          var s = document.createElement('script');
          s.type = 'module';
          s.src = './assets/prompt-machine-v4.js?v=20260905m';
          s.onerror = function () {
            fail('Prompt Machine failed to load. Hard-refresh or open your Owner door again.');
          };
          document.head.appendChild(s);
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = './assets/prompt-machine-v4.css?v=20260905m';
          document.head.appendChild(l);
        } catch (e) {
          fail('Could not unlock the machine. Try Owner door or refresh.');
          console.error(e);
        }
      })();
    </script>
  </body>
</html>
