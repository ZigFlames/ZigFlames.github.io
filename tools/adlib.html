<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ZigFlames Ad-Lib Pad</title>
  <style>
    :root {
      --bg: #0b0b0c;
      --panel: #161618;
      --pad: #1e1e22;
      --pad-hot: #2a1810;
      --accent: #ff5a1f;
      --accent2: #ffcc33;
      --text: #f2f2f2;
      --muted: #8a8a93;
      --ok: #3dd68c;
      --danger: #ff4d6d;
      --border: #2a2a30;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: radial-gradient(1200px 600px at 50% -10%, #1a120c 0%, var(--bg) 55%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      padding: 1.25rem 1.25rem 0.5rem;
      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between;
    }
    h1 {
      margin: 0; font-size: 1.15rem; letter-spacing: 0.04em; text-transform: uppercase;
      font-weight: 700;
    }
    h1 span { color: var(--accent); }
    .controls {
      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;
    }
    .controls label { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 0.4rem; }
    input[type="range"] { width: 110px; accent-color: var(--accent); }
    button, .file-btn {
      appearance: none; border: 1px solid var(--border); background: var(--panel);
      color: var(--text); border-radius: 10px; padding: 0.55rem 0.85rem;
      font-size: 0.85rem; cursor: pointer; font-weight: 600;
    }
    button:hover, .file-btn:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #111; }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    main {
      padding: 1rem 1.25rem 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .pad {
      background: linear-gradient(180deg, #1c1c20, var(--pad));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1rem;
      display: flex; flex-direction: column; gap: 0.75rem;
      min-height: 280px;
      transition: transform 0.05s ease, box-shadow 0.05s ease, border-color 0.1s;
      user-select: none;
      touch-action: manipulation;
    }
    .pad.armed { border-color: var(--accent2); }
    .pad.playing {
      transform: scale(0.985);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 12px 40px rgba(255, 90, 31, 0.25);
      background: linear-gradient(180deg, #2a1a12, var(--pad-hot));
    }
    .pad-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
    .pad-name {
      width: 100%; background: transparent; border: none; color: var(--text);
      font-size: 1.15rem; font-weight: 700; padding: 0; outline: none;
    }
    .keybind {
      flex-shrink: 0; min-width: 2rem; text-align: center;
      background: #0f0f12; border: 1px solid var(--border); border-radius: 8px;
      padding: 0.25rem 0.45rem; font-weight: 800; color: var(--accent2);
      font-size: 0.9rem;
    }
    .wave {
      height: 56px; border-radius: 10px; background: #0f0f12; border: 1px solid var(--border);
      overflow: hidden;
    }
    .wave canvas { width: 100%; height: 100%; display: block; }
    .meta { font-size: 0.75rem; color: var(--muted); min-height: 1.1em; }
    .row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .row > * { flex: 1 1 auto; }
    .drop {
      border: 1px dashed var(--border); border-radius: 12px; padding: 0.75rem;
      text-align: center; color: var(--muted); font-size: 0.8rem;
    }
    .drop.over { border-color: var(--accent); color: var(--accent2); background: rgba(255,90,31,0.08); }
    .hint {
      margin: 0 1.25rem 1.5rem; color: var(--muted); font-size: 0.85rem; line-height: 1.45;
      max-width: 52rem;
    }
    .status { color: var(--ok); }
    input[type="file"] { display: none; }
  
    .zf-tools-bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;padding:.65rem .85rem;margin:0 0 1rem;background:rgba(11,11,12,.92);border:1px solid #2a2a30;border-radius:12px;backdrop-filter:blur(8px);font-size:.8rem}
    .zf-tools-bar a{color:#ffcc33;text-decoration:none;font-weight:700}
    .zf-tools-bar a:hover{color:#ff5a1f}
    .zf-tools-bar nav{display:flex;flex-wrap:wrap;gap:.65rem}
    .zf-tools-bar .muted{color:#8a8a93;font-weight:600}

  </style>
</head>
<body>

  <div class="zf-tools-bar">
    <a href="/tools/">← Studio Tools</a>
    <nav aria-label="Studio tools">
      <a href="/tools/adlib.html">Ad-Lib</a>
      <a href="/tools/trim.html">Trim</a>
      <a href="/tools/echo.html">Echo</a>
      <a href="/tools/pitch.html">Pitch</a>
      <a class="muted" href="/studio.html">Studio</a>
    </nav>
  </div>

  <header>
    <h1>ZigFlames <span>Ad-Lib Pad</span></h1>
    <div class="controls">
      <label>Master <input id="master" type="range" min="0" max="1" step="0.01" value="0.9" /></label>
      <button id="muteBtn" type="button">Mute</button>
      <button id="addPad" type="button">+ Pad</button>
      <button id="unlock" class="primary" type="button">Enable Audio</button>
    </div>
  </header>
  <p class="hint">
    Drop or record short ad-libs. We trim silence and normalize. Hit the key (or tap the pad) to fire over whatever beat is playing elsewhere — Grok, a DAW, another tab. No Suno. Samples stay in this browser until you clear them.
  </p>
  <main id="pads"></main>

  <script>
    const DB_NAME = 'zigflames-adlib-pad';
    const DB_STORE = 'pads';
    const DEFAULT_PADS = [
      { id: 'burn', name: 'Burn Them!', key: '1' },
      { id: 'sick', name: 'Sick Flames!', key: '2' },
    ];

    let audioCtx = null;
    let masterGain = null;
    let muted = false;
    const pads = new Map(); // id -> state
    const activeSources = new Map(); // id -> AudioBufferSourceNode

    const $pads = document.getElementById('pads');
    const $master = document.getElementById('master');
    const $mute = document.getElementById('muteBtn');
    const $add = document.getElementById('addPad');
    const $unlock = document.getElementById('unlock');

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = muted ? 0 : Number($master.value);
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(DB_STORE)) {
            db.createObjectStore(DB_STORE, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function savePadMeta(pad) {
      const db = await openDb();
      const record = {
        id: pad.id,
        name: pad.name,
        key: pad.key,
        sampleRate: pad.buffer ? pad.buffer.sampleRate : null,
        channels: pad.buffer ? pad.buffer.numberOfChannels : null,
        length: pad.buffer ? pad.buffer.length : null,
        pcm: pad.buffer ? bufferToPcm(pad.buffer) : null,
      };
      await new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(record);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadAllPads() {
      const db = await openDb();
      const rows = await new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readonly');
        const req = tx.objectStore(DB_STORE).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
      return rows;
    }

    async function deletePadDb(id) {
      const db = await openDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).delete(id);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    function bufferToPcm(buffer) {
      const ch = buffer.numberOfChannels;
      const len = buffer.length;
      const out = new Float32Array(len * ch);
      for (let c = 0; c < ch; c++) {
        const data = buffer.getChannelData(c);
        for (let i = 0; i < len; i++) out[i * ch + c] = data[i];
      }
      return out;
    }

    function pcmToBuffer(pcm, sampleRate, channels) {
      const len = pcm.length / channels;
      const buffer = ensureAudio().createBuffer(channels, len, sampleRate);
      for (let c = 0; c < channels; c++) {
        const data = buffer.getChannelData(c);
        for (let i = 0; i < len; i++) data[i] = pcm[i * channels + c];
      }
      return buffer;
    }

    function trimAndNormalize(buffer) {
      const ch = buffer.numberOfChannels;
      const len = buffer.length;
      const mixed = new Float32Array(len);
      for (let c = 0; c < ch; c++) {
        const data = buffer.getChannelData(c);
        for (let i = 0; i < len; i++) mixed[i] += data[i] / ch;
      }
      const thresh = 0.004;
      let start = 0;
      let end = len - 1;
      while (start < len && Math.abs(mixed[start]) < thresh) start++;
      while (end > start && Math.abs(mixed[end]) < thresh) end--;
      // small pad
      start = Math.max(0, start - Math.floor(buffer.sampleRate * 0.01));
      end = Math.min(len - 1, end + Math.floor(buffer.sampleRate * 0.02));
      const newLen = Math.max(1, end - start + 1);
      const out = ensureAudio().createBuffer(ch, newLen, buffer.sampleRate);
      let peak = 0;
      for (let c = 0; c < ch; c++) {
        const src = buffer.getChannelData(c);
        const dst = out.getChannelData(c);
        for (let i = 0; i < newLen; i++) {
          dst[i] = src[start + i];
          peak = Math.max(peak, Math.abs(dst[i]));
        }
      }
      const target = 0.89;
      const gain = peak > 0 ? target / peak : 1;
      if (gain !== 1) {
        for (let c = 0; c < ch; c++) {
          const dst = out.getChannelData(c);
          for (let i = 0; i < newLen; i++) dst[i] *= gain;
        }
      }
      return out;
    }

    function drawWave(canvas, buffer) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width = canvas.clientWidth * devicePixelRatio;
      const h = canvas.height = canvas.clientHeight * devicePixelRatio;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#0f0f12';
      ctx.fillRect(0, 0, w, h);
      if (!buffer) return;
      const data = buffer.getChannelData(0);
      const step = Math.max(1, Math.floor(data.length / w));
      ctx.strokeStyle = '#ff5a1f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      const mid = h / 2;
      for (let x = 0; x < w; x++) {
        let min = 1, max = -1;
        const start = x * step;
        for (let i = 0; i < step && start + i < data.length; i++) {
          const v = data[start + i];
          if (v < min) min = v;
          if (v > max) max = v;
        }
        ctx.moveTo(x, mid + min * mid * 0.9);
        ctx.lineTo(x, mid + max * mid * 0.9);
      }
      ctx.stroke();
    }

    function bufferToWavBlob(buffer) {
      const numChan = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const format = 1;
      const bitDepth = 16;
      const samples = buffer.length;
      const blockAlign = numChan * bitDepth / 8;
      const byteRate = sampleRate * blockAlign;
      const dataSize = samples * blockAlign;
      const ab = new ArrayBuffer(44 + dataSize);
      const view = new DataView(ab);
      const writeStr = (off, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
      };
      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, format, true);
      view.setUint16(22, numChan, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitDepth, true);
      writeStr(36, 'data');
      view.setUint32(40, dataSize, true);
      let offset = 44;
      const chans = [];
      for (let c = 0; c < numChan; c++) chans.push(buffer.getChannelData(c));
      for (let i = 0; i < samples; i++) {
        for (let c = 0; c < numChan; c++) {
          let s = Math.max(-1, Math.min(1, chans[c][i]));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
          offset += 2;
        }
      }
      return new Blob([ab], { type: 'audio/wav' });
    }

    function playPad(id) {
      const pad = pads.get(id);
      if (!pad || !pad.buffer) return;
      ensureAudio();
      const prev = activeSources.get(id);
      if (prev) {
        try { prev.stop(); } catch (_) {}
      }
      const src = audioCtx.createBufferSource();
      src.buffer = pad.buffer;
      src.connect(masterGain);
      src.onended = () => {
        if (activeSources.get(id) === src) {
          activeSources.delete(id);
          pad.el.classList.remove('playing');
        }
      };
      activeSources.set(id, src);
      pad.el.classList.add('playing');
      src.start(0);
    }

    function setMeta(pad, text) {
      pad.metaEl.textContent = text || '';
    }

    async function assignBuffer(pad, rawBuffer, label) {
      ensureAudio();
      const processed = trimAndNormalize(rawBuffer);
      pad.buffer = processed;
      drawWave(pad.canvas, processed);
      const ms = Math.round((processed.length / processed.sampleRate) * 1000);
      setMeta(pad, `${label || 'Ready'} · ${ms} ms · trimmed + normalized`);
      pad.el.classList.add('armed');
      await savePadMeta(pad);
    }

    async function decodeFile(file) {
      ensureAudio();
      const ab = await file.arrayBuffer();
      return await audioCtx.decodeAudioData(ab.slice(0));
    }

    function makePad(config) {
      const pad = {
        id: config.id,
        name: config.name,
        key: config.key,
        buffer: null,
        recorder: null,
        chunks: [],
        recording: false,
      };

      const el = document.createElement('article');
      el.className = 'pad';
      el.dataset.id = pad.id;
      el.innerHTML = `
        <div class="pad-top">
          <input class="pad-name" value="${escapeAttr(pad.name)}" aria-label="Pad name" />
          <button type="button" class="keybind" title="Click then press a key to rebind">${escapeHtml(pad.key)}</button>
        </div>
        <div class="wave"><canvas></canvas></div>
        <div class="meta"></div>
        <div class="drop">Drop audio here (wav / mp3 / m4a)</div>
        <div class="row">
          <label class="file-btn">Load<input type="file" accept="audio/*" /></label>
          <button type="button" class="rec">Record</button>
          <button type="button" class="play primary">Play</button>
        </div>
        <div class="row">
          <button type="button" class="export">Export WAV</button>
          <button type="button" class="clear danger">Clear</button>
        </div>
      `;
      $pads.appendChild(el);

      pad.el = el;
      pad.canvas = el.querySelector('canvas');
      pad.metaEl = el.querySelector('.meta');
      pad.nameInput = el.querySelector('.pad-name');
      pad.keyBtn = el.querySelector('.keybind');
      pad.drop = el.querySelector('.drop');
      pad.fileInput = el.querySelector('input[type=file]');
      pad.recBtn = el.querySelector('.rec');
      pad.playBtn = el.querySelector('.play');
      pad.exportBtn = el.querySelector('.export');
      pad.clearBtn = el.querySelector('.clear');

      pad.nameInput.addEventListener('change', async () => {
        pad.name = pad.nameInput.value.trim() || pad.name;
        await savePadMeta(pad);
      });

      pad.keyBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        pad.keyBtn.textContent = '…';
        const onKey = (ev) => {
          ev.preventDefault();
          const k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
          pad.key = k;
          pad.keyBtn.textContent = k;
          savePadMeta(pad);
          window.removeEventListener('keydown', onKey, true);
        };
        window.addEventListener('keydown', onKey, true);
      });

      const onFiles = async (files) => {
        const file = files && files[0];
        if (!file) return;
        try {
          setMeta(pad, 'Processing…');
          const buf = await decodeFile(file);
          await assignBuffer(pad, buf, file.name);
        } catch (err) {
          setMeta(pad, 'Could not read that file');
          console.error(err);
        }
      };

      pad.fileInput.addEventListener('change', () => onFiles(pad.fileInput.files));
      ;['dragenter', 'dragover'].forEach((evt) => {
        pad.drop.addEventListener(evt, (e) => {
          e.preventDefault();
          pad.drop.classList.add('over');
        });
      });
      ;['dragleave', 'drop'].forEach((evt) => {
        pad.drop.addEventListener(evt, (e) => {
          e.preventDefault();
          pad.drop.classList.remove('over');
          if (evt === 'drop') onFiles(e.dataTransfer.files);
        });
      });

      pad.playBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        playPad(pad.id);
      });
      el.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button, input, label, .drop')) return;
        playPad(pad.id);
      });

      pad.recBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        ensureAudio();
        if (pad.recording) {
          pad.recorder.stop();
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          pad.chunks = [];
          const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
            ? 'audio/webm;codecs=opus'
            : 'audio/webm';
          pad.recorder = new MediaRecorder(stream);
          pad.recorder.ondataavailable = (ev) => {
            if (ev.data.size) pad.chunks.push(ev.data);
          };
          pad.recorder.onstop = async () => {
            pad.recording = false;
            pad.recBtn.textContent = 'Record';
            pad.recBtn.classList.remove('danger');
            stream.getTracks().forEach((t) => t.stop());
            const blob = new Blob(pad.chunks, { type: mime });
            setMeta(pad, 'Processing take…');
            const ab = await blob.arrayBuffer();
            const buf = await audioCtx.decodeAudioData(ab.slice(0));
            await assignBuffer(pad, buf, 'Recording');
          };
          pad.recorder.start();
          pad.recording = true;
          pad.recBtn.textContent = 'Stop';
          pad.recBtn.classList.add('danger');
          setMeta(pad, 'Recording… yell it');
        } catch (err) {
          setMeta(pad, 'Mic permission needed');
          console.error(err);
        }
      });

      pad.exportBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!pad.buffer) return;
        const blob = bufferToWavBlob(pad.buffer);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${slug(pad.name) || pad.id}.wav`;
        a.click();
        URL.revokeObjectURL(a.href);
      });

      pad.clearBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        pad.buffer = null;
        drawWave(pad.canvas, null);
        pad.el.classList.remove('armed', 'playing');
        setMeta(pad, '');
        await savePadMeta(pad);
      });

      pads.set(pad.id, pad);
      drawWave(pad.canvas, null);
      return pad;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }
    function escapeAttr(s) { return escapeHtml(s); }
    function slug(s) {
      return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.target.matches('input, textarea')) return;
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      for (const pad of pads.values()) {
        if (pad.key === k || pad.key === e.key) {
          e.preventDefault();
          playPad(pad.id);
          break;
        }
      }
    });

    $master.addEventListener('input', () => {
      if (masterGain && !muted) masterGain.gain.value = Number($master.value);
    });
    $mute.addEventListener('click', () => {
      muted = !muted;
      $mute.textContent = muted ? 'Unmute' : 'Mute';
      if (masterGain) masterGain.gain.value = muted ? 0 : Number($master.value);
    });
    $unlock.addEventListener('click', () => {
      ensureAudio();
      $unlock.textContent = 'Audio On';
      $unlock.disabled = true;
    });
    $add.addEventListener('click', async () => {
      const n = pads.size + 1;
      const pad = makePad({ id: 'pad-' + Date.now(), name: 'Ad-Lib ' + n, key: String(n % 10) });
      await savePadMeta(pad);
    });

    async function boot() {
      const saved = await loadAllPads();
      if (saved.length) {
        for (const row of saved) {
          const pad = makePad({ id: row.id, name: row.name, key: row.key });
          if (row.pcm && row.sampleRate && row.channels && row.length) {
            ensureAudio();
            // pcm may come back as plain object — rebuild Float32Array
            const pcm = row.pcm instanceof Float32Array ? row.pcm : Float32Array.from(Object.values(row.pcm));
            pad.buffer = pcmToBuffer(pcm, row.sampleRate, row.channels);
            drawWave(pad.canvas, pad.buffer);
            const ms = Math.round((pad.buffer.length / pad.buffer.sampleRate) * 1000);
            setMeta(pad, `Loaded · ${ms} ms`);
            pad.el.classList.add('armed');
          }
        }
      } else {
        for (const d of DEFAULT_PADS) {
          const pad = makePad(d);
          await savePadMeta(pad);
        }
      }
    }

    boot().catch(console.error);
  </script>
</body>
</html>
