<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hall Echo Machine — ZigFlames</title>
  <style>
    :root {
      --bg: #0b0b0c; --panel: #161618; --text: #f2f2f2; --muted: #8a8a93;
      --accent: #ff5a1f; --accent2: #ffcc33; --border: #2a2a30; --ok: #3dd68c; --hall: #6ea8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background:
        radial-gradient(900px 500px at 80% -10%, #12203a 0%, transparent 50%),
        radial-gradient(700px 400px at 10% 0%, #2a140c 0%, var(--bg) 55%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      padding: 1.25rem; max-width: 640px; margin-inline: auto;
    }
    h1 { font-size: 1.1rem; margin: 0 0 0.35rem; letter-spacing: 0.03em; text-transform: uppercase; }
    h1 span { color: var(--hall); }
    p { color: var(--muted); font-size: 0.9rem; line-height: 1.45; margin: 0 0 1.25rem; }
    .drop {
      border: 1.5px dashed var(--border); border-radius: 16px; padding: 2rem 1rem;
      text-align: center; color: var(--muted); margin-bottom: 1rem; cursor: pointer;
      background: var(--panel);
    }
    .drop.over { border-color: var(--hall); color: var(--accent2); }
    .panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
      padding: 1rem; margin-bottom: 1rem;
    }
    .panel h2 {
      margin: 0 0 0.75rem; font-size: 0.75rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted); font-weight: 700;
    }
    label.row {
      display: grid; grid-template-columns: 6.5rem 1fr 3.6rem;
      gap: 0.55rem; align-items: center; margin: 0.55rem 0; font-size: 0.85rem; color: var(--muted);
    }
    input[type="range"] { width: 100%; accent-color: var(--hall); }
    .val { text-align: right; color: var(--accent2); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.8rem; }
    .presets { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.5rem; }
    .presets button {
      font-size: 0.75rem; padding: 0.4rem 0.7rem; border-radius: 999px;
    }
    .presets button.on { border-color: var(--hall); color: var(--hall); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    button {
      appearance: none; border: 1px solid var(--border); background: #111114;
      color: var(--text); border-radius: 10px; padding: 0.65rem 1rem;
      font-weight: 700; cursor: pointer; font-size: 0.9rem;
    }
    button.primary { background: var(--hall); border-color: var(--hall); color: #0b0b0c; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .meta { font-size: 0.8rem; color: var(--ok); min-height: 1.2em; margin-top: 0.85rem; }
    input[type="file"] { display: none; }
  
    .zf-tools-bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;padding:.65rem .85rem;margin:0 0 1rem;background:rgba(11,11,12,.92);border:1px solid #2a2a30;border-radius:12px;backdrop-filter:blur(8px);font-size:.8rem}
    .zf-tools-bar a{color:#ffcc33;text-decoration:none;font-weight:700}
    .zf-tools-bar a:hover{color:#ff5a1f}
    .zf-tools-bar nav{display:flex;flex-wrap:wrap;gap:.65rem}
    .zf-tools-bar .muted{color:#8a8a93;font-weight:600}

  </style>
</head>
<body>

  <div class="zf-tools-bar">
    <a href="/tools/">← Studio Tools</a>
    <nav aria-label="Studio tools">
      <a href="/tools/adlib.html">Ad-Lib</a>
      <a href="/tools/trim.html">Trim</a>
      <a href="/tools/echo.html">Echo</a>
      <a href="/tools/pitch.html">Pitch</a>
      <a class="muted" href="/studio.html">Studio</a>
    </nav>
  </div>

  <h1>Hall <span>Echo Machine</span></h1>
  <p>Drop an ad-lib. Dial the hall and the slap echoes. Preview until it feels right, then download the wet WAV for your pad.</p>

  <div class="drop" id="drop">Drop audio here — or tap to choose</div>
  <input type="file" id="file" accept="audio/*" />

  <div class="panel">
    <h2>Presets</h2>
    <div class="presets" id="presets">
      <button type="button" data-p="tight">Tight room</button>
      <button type="button" data-p="hall" class="on">My hall</button>
      <button type="button" data-p="tunnel">Tunnel</button>
      <button type="button" data-p="ghost">Ghost slap</button>
    </div>
  </div>

  <div class="panel">
    <h2>Hall</h2>
    <label class="row">Size
      <input type="range" id="size" min="0.4" max="4" step="0.05" value="2.2" disabled />
      <span class="val" id="sizeVal">2.2 s</span>
    </label>
    <label class="row">Hall mix
      <input type="range" id="hallMix" min="0" max="1" step="0.01" value="0.35" disabled />
      <span class="val" id="hallMixVal">35%</span>
    </label>
  </div>

  <div class="panel">
    <h2>Echo (slap)</h2>
    <label class="row">Time
      <input type="range" id="delay" min="40" max="900" step="5" value="280" disabled />
      <span class="val" id="delayVal">280 ms</span>
    </label>
    <label class="row">Feedback
      <input type="range" id="fb" min="0" max="0.85" step="0.01" value="0.28" disabled />
      <span class="val" id="fbVal">28%</span>
    </label>
    <label class="row">Echo mix
      <input type="range" id="echoMix" min="0" max="1" step="0.01" value="0.22" disabled />
      <span class="val" id="echoMixVal">22%</span>
    </label>
  </div>

  <div class="panel">
    <h2>Output</h2>
    <label class="row">Dry
      <input type="range" id="dry" min="0" max="1" step="0.01" value="0.85" disabled />
      <span class="val" id="dryVal">85%</span>
    </label>
  </div>

  <div class="actions">
    <button type="button" id="play" class="primary" disabled>Test echo</button>
    <button type="button" id="stop" disabled>Stop</button>
    <button type="button" id="dl" disabled>Download WAV</button>
  </div>
  <div class="meta" id="meta"></div>

  <script>
    let audioCtx, buffer, playingSource, offlineBusy = false;
    const $ = (id) => document.getElementById(id);
    const els = {
      drop: $('drop'), file: $('file'), size: $('size'), hallMix: $('hallMix'),
      delay: $('delay'), fb: $('fb'), echoMix: $('echoMix'), dry: $('dry'),
      sizeVal: $('sizeVal'), hallMixVal: $('hallMixVal'), delayVal: $('delayVal'),
      fbVal: $('fbVal'), echoMixVal: $('echoMixVal'), dryVal: $('dryVal'),
      play: $('play'), stop: $('stop'), dl: $('dl'), meta: $('meta'), presets: $('presets'),
    };

    const PRESETS = {
      tight: { size: 0.9, hallMix: 0.18, delay: 120, fb: 0.15, echoMix: 0.12, dry: 0.95 },
      hall:  { size: 2.2, hallMix: 0.35, delay: 280, fb: 0.28, echoMix: 0.22, dry: 0.85 },
      tunnel:{ size: 3.4, hallMix: 0.48, delay: 420, fb: 0.4,  echoMix: 0.3,  dry: 0.75 },
      ghost: { size: 1.6, hallMix: 0.22, delay: 360, fb: 0.55, echoMix: 0.4,  dry: 0.7  },
    };

    function ensure() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function vals() {
      return {
        size: Number(els.size.value),
        hallMix: Number(els.hallMix.value),
        delay: Number(els.delay.value) / 1000,
        fb: Number(els.fb.value),
        echoMix: Number(els.echoMix.value),
        dry: Number(els.dry.value),
      };
    }

    function refreshLabels() {
      const v = vals();
      els.sizeVal.textContent = v.size.toFixed(2) + ' s';
      els.hallMixVal.textContent = Math.round(v.hallMix * 100) + '%';
      els.delayVal.textContent = Math.round(v.delay * 1000) + ' ms';
      els.fbVal.textContent = Math.round(v.fb * 100) + '%';
      els.echoMixVal.textContent = Math.round(v.echoMix * 100) + '%';
      els.dryVal.textContent = Math.round(v.dry * 100) + '%';
    }

    // Synthetic hall impulse — decaying noise with early reflections vibe
    function makeHallIR(ctx, seconds) {
      const rate = ctx.sampleRate;
      const len = Math.max(1, Math.floor(rate * seconds));
      const ir = ctx.createBuffer(2, len, rate);
      for (let c = 0; c < 2; c++) {
        const data = ir.getChannelData(c);
        for (let i = 0; i < len; i++) {
          const t = i / rate;
          // exponential decay + slight stereo decorrelation
          const env = Math.exp(-t * (2.8 / Math.max(0.4, seconds)));
          const early = i < rate * 0.05 ? (1 - i / (rate * 0.05)) * 0.35 : 0;
          const n = (Math.random() * 2 - 1);
          data[i] = (n * env + n * early * 0.5) * (c === 0 ? 1 : 0.92 + Math.random() * 0.08);
        }
        // soften click at start
        for (let i = 0; i < Math.min(64, len); i++) data[i] *= i / 64;
      }
      return ir;
    }

    function wireGraph(ctx, srcNode, params, destination) {
      const dry = ctx.createGain();
      dry.gain.value = params.dry;
      srcNode.connect(dry);
      dry.connect(destination);

      // Echo / delay
      const delay = ctx.createDelay(1.5);
      delay.delayTime.value = params.delay;
      const feedback = ctx.createGain();
      feedback.gain.value = params.fb;
      const echoGain = ctx.createGain();
      echoGain.gain.value = params.echoMix;
      const echoFilter = ctx.createBiquadFilter();
      echoFilter.type = 'lowpass';
      echoFilter.frequency.value = 4500;
      srcNode.connect(delay);
      delay.connect(feedback);
      feedback.connect(delay);
      delay.connect(echoFilter);
      echoFilter.connect(echoGain);
      echoGain.connect(destination);

      // Hall convolver
      const conv = ctx.createConvolver();
      conv.buffer = makeHallIR(ctx, params.size);
      const hallGain = ctx.createGain();
      hallGain.gain.value = params.hallMix;
      srcNode.connect(conv);
      conv.connect(hallGain);
      hallGain.connect(destination);

      return { delay, feedback, echoGain, hallGain, dry, conv };
    }

    function stopPlay() {
      if (playingSource) {
        try { playingSource.stop(); } catch (_) {}
        playingSource = null;
      }
    }

    function play() {
      if (!buffer) return;
      ensure();
      stopPlay();
      const params = vals();
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      const tail = Math.max(params.size, params.delay * 6) + 0.4;
      wireGraph(audioCtx, src, params, audioCtx.destination);
      playingSource = src;
      src.onended = () => { if (playingSource === src) playingSource = null; };
      src.start(0);
      els.meta.textContent = 'Playing wet…';
      // allow natural tail by not stopping early
    }

    function bufferToWav(buf) {
      const numChan = buf.numberOfChannels;
      const sampleRate = buf.sampleRate;
      const samples = buf.length;
      const blockAlign = numChan * 2;
      const dataSize = samples * blockAlign;
      const ab = new ArrayBuffer(44 + dataSize);
      const view = new DataView(ab);
      const str = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
      str(0, 'RIFF'); view.setUint32(4, 36 + dataSize, true); str(8, 'WAVE'); str(12, 'fmt ');
      view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, numChan, true);
      view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true); view.setUint16(34, 16, true); str(36, 'data');
      view.setUint32(40, dataSize, true);
      let off = 44;
      const chans = Array.from({ length: numChan }, (_, c) => buf.getChannelData(c));
      for (let i = 0; i < samples; i++) {
        for (let c = 0; c < numChan; c++) {
          let s = Math.max(-1, Math.min(1, chans[c][i]));
          view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
          off += 2;
        }
      }
      return new Blob([ab], { type: 'audio/wav' });
    }

    async function renderOffline() {
      if (!buffer || offlineBusy) return null;
      offlineBusy = true;
      els.meta.textContent = 'Rendering hall echo…';
      const params = vals();
      const tail = Math.max(params.size, params.delay * 8) + 0.5;
      const sr = buffer.sampleRate;
      const len = buffer.length + Math.floor(tail * sr);
      const offline = new OfflineAudioContext(buffer.numberOfChannels, len, sr);
      const src = offline.createBufferSource();
      src.buffer = buffer;
      wireGraph(offline, src, params, offline.destination);
      src.start(0);
      const rendered = await offline.startRendering();
      offlineBusy = false;
      return rendered;
    }

    async function download() {
      const rendered = await renderOffline();
      if (!rendered) return;
      const blob = bufferToWav(rendered);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'adlib-hall-echo.wav';
      a.click();
      URL.revokeObjectURL(a.href);
      els.meta.textContent = 'Downloaded wet WAV';
    }

    function enableUi(on) {
      [els.size, els.hallMix, els.delay, els.fb, els.echoMix, els.dry, els.play, els.stop, els.dl]
        .forEach((el) => { el.disabled = !on; });
    }

    function applyPreset(name) {
      const p = PRESETS[name];
      if (!p) return;
      els.size.value = p.size;
      els.hallMix.value = p.hallMix;
      els.delay.value = p.delay;
      els.fb.value = p.fb;
      els.echoMix.value = p.echoMix;
      els.dry.value = p.dry;
      refreshLabels();
      els.presets.querySelectorAll('button').forEach((b) => {
        b.classList.toggle('on', b.dataset.p === name);
      });
    }

    async function loadFile(file) {
      ensure();
      els.meta.textContent = 'Loading…';
      const ab = await file.arrayBuffer();
      buffer = await audioCtx.decodeAudioData(ab.slice(0));
      enableUi(true);
      els.drop.textContent = file.name;
      const ms = Math.round((buffer.length / buffer.sampleRate) * 1000);
      els.meta.textContent = `Loaded · ${ms} ms — hit Test echo`;
      refreshLabels();
    }

    els.drop.addEventListener('click', () => els.file.click());
    els.file.addEventListener('change', () => { if (els.file.files[0]) loadFile(els.file.files[0]); });
    ;['dragenter', 'dragover'].forEach((e) => els.drop.addEventListener(e, (ev) => {
      ev.preventDefault(); els.drop.classList.add('over');
    }));
    ;['dragleave', 'drop'].forEach((e) => els.drop.addEventListener(e, (ev) => {
      ev.preventDefault(); els.drop.classList.remove('over');
      if (e === 'drop' && ev.dataTransfer.files[0]) loadFile(ev.dataTransfer.files[0]);
    }));

    ['size', 'hallMix', 'delay', 'fb', 'echoMix', 'dry'].forEach((id) => {
      $(id).addEventListener('input', refreshLabels);
    });

    els.presets.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-p]');
      if (btn) applyPreset(btn.dataset.p);
    });

    els.play.addEventListener('click', play);
    els.stop.addEventListener('click', () => { stopPlay(); els.meta.textContent = 'Stopped'; });
    els.dl.addEventListener('click', () => download().catch((err) => {
      els.meta.textContent = 'Render failed';
      console.error(err);
      offlineBusy = false;
    }));

    refreshLabels();
  </script>
</body>
</html>
