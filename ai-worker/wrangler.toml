# ZigFlames "Talk to it" AI worker. Deploy from this folder: `npx wrangler deploy`
name = "zigflames-ai"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
account_id = "57775bbb399e92b359876589f0937d92"

[vars]
# Cheap JSON-capable model on OpenRouter (verified Oct 2026: $0.10/M input, $0.40/M output).
# Alternatives: "mistralai/mistral-small-3.2-24b-instruct", "meta-llama/llama-3.3-70b-instruct"
MODEL = "google/gemini-2.5-flash-lite"
RATE_LIMIT_PER_MIN = "20"
# THE money switch (models.js): "free" = OpenRouter :free models only ($0, ~50 requests/day on a $0 account);
# "paid" = MODEL / CHAT_MODEL (Gemini, Grok) first, free models as backup. AI Studio chat's picker can still ask
# for gemini / gpt / grok directly; those answer "needs credit" until the OpenRouter balance is > $0.
AI_TIER = "free"
# AI Boost (boost.js): chat model + media spend caps (USD/day across everyone, per-IP counts/day)
CHAT_MODEL = "x-ai/grok-4.20"
CHAT_MAX_TOKENS = "600"
DAILY_MEDIA_USD_CAP = "3"
DAILY_IMAGES_PER_IP = "40"
DAILY_VIDEOS_PER_IP = "6"

[[kv_namespaces]]
binding = "SPEND"
id = "cc638181a2d04701beb2097e85322a9a"

# Secret (NOT in this file): npx wrangler secret put OPENROUTER_API_KEY
# Optional media secrets (each provider shows "needs key" until set):
#   XAI_API_KEY (Grok Imagine image/video) · VENICE_API_KEY (Venice, uncensored, 18+ mode only)
#   FAL_KEY (fal.ai FLUX, 18+ mode only) · MODELSLAB_API_KEY (ModelsLab, 18+ mode only)
