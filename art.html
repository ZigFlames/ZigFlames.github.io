    <section class="exhibit" id="exhibit">
      <p class="exhibit-hint">Click any piece. Shift your focus.</p>
      <div class="exhibit-grid">
        <figure class="piece piece-center" data-full="assets/brand/zig-flame-studio.jpg">
          <button type="button" class="piece-open" aria-label="Open Zig Flame, full screen">

        </figure>
        <figure class="piece piece-center" data-full="assets/exhibit/ii.jpg">
          <button type="button" class="piece-open" aria-label="Open II, full screen">

          <figcaption>II</figcaption>

        <figure class="piece" data-full="assets/exhibit/i.jpg">
          <button type="button" class="piece-open" aria-label="Open I, full screen">

          <figcaption>I</figcaption>
        </figure>
        <figure class="piece" data-full="assets/exhibit/iii.jpg">
          <button type="button" class="piece-open" aria-label="Open III, full screen">

        <figure class="piece" data-full="assets/exhibit/iv.jpg">

          </button>
          <figcaption>IV</figcaption>
        </figure>
        <figure class="piece" data-full="assets/portraits/flames-city.jpg">
          <button type="button" class="piece-open" aria-label="Open V, full screen">
            <img src="assets/portraits/flames-city.jpg" width="2400" height="1004" alt="">
          </button>
          <figcaption>V</figcaption>
        </figure>
      </div>

      <div class="exhibit-series" id="a-little-rusty">
        <p class="section-kicker">The Edge</p>
        <h2 class="series-title">A Little Rusty</h2>
        <div class="exhibit-grid rusty-grid">
          <figure class="piece" data-full="assets/exhibit/levitation.jpg">
            <button type="button" class="piece-open" aria-label="Open 002 Levitation, full screen">
