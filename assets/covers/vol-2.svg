    <line x1="80" y1="0" x2="40" y2="800"/>
    <line x1="140" y1="0" x2="110" y2="800"/>
    <line x1="210" y1="0" x2="190" y2="800"/>
    <line x1="280" y1="0" x2="270" y2="800"/>
    <line x1="340" y1="0" x2="348" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="460" y1="0" x2="452" y2="800"/>
    <line x1="520" y1="0" x2="530" y2="800"/>
    <line x1="590" y1="0" x2="610" y2="800"/>
    <line x1="660" y1="0" x2="690" y2="800"/>
    <line x1="720" y1="0" x2="760" y2="800"/>
