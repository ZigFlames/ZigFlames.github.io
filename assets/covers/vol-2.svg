<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="v2title v2desc">
  <title id="v2title">ZigFlames, Vol. 2: Desperado Music Beats</title>
  <desc id="v2desc">Typographic album cover. Gold moon over a dark horizon with rain lines.</desc>
  <defs>
    <radialGradient id="v2sky" cx="50%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#2a2214"/>
      <stop offset="45%" stop-color="#12110e"/>
      <stop offset="100%" stop-color="#070708"/>
    </radialGradient>
    <radialGradient id="v2moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3e6b4"/>
      <stop offset="55%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#7a5e1e"/>
    </radialGradient>
    <linearGradient id="v2gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e2b0"/>
      <stop offset="100%" stop-color="#b8923a"/>
    </linearGradient>
    <filter id="v2soft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#v2sky)"/>
  <circle cx="400" cy="268" r="86" fill="#c9a84c" opacity="0.18" filter="url(#v2soft)"/>
  <circle cx="400" cy="268" r="54" fill="url(#v2moon)"/>
  <circle cx="418" cy="252" r="54" fill="#12110e" opacity="0.22"/>
