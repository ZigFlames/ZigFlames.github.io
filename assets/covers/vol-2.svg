  <text x="400" y="588" text-anchor="middle" fill="#ede8dc" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="12">MUSIC BEATS</text>
  <line x1="300" y1="612" x2="500" y2="612" stroke="#c9a84c" stroke-width="0.6" opacity="0.5"/>
  <text x="400" y="652" text-anchor="middle" fill="#9a9588" font-family="Georgia, serif" font-size="16" letter-spacing="6">ZIGFLAMES</text>
